# Daily run (copy to .github/workflows/bellhaven-sync.yml in the repo).
# Runs the scraper + matcher and stops at the review queue: nothing writes
# to the CRM without a human approval in the review app.
name: bellhaven-sync-daily
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scraper.py && python matcher.py
        env: { BELLHAVEN_TOKEN: ${{ secrets.BELLHAVEN_TOKEN }} }
      - run: echo "Review proposals.json in the review app before approving anything."
